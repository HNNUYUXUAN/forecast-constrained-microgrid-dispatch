name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Public boundary
        run: python scripts/check_public_boundary.py
      - name: Repository metadata
        run: python scripts/check_repository_metadata.py
      - name: Synthetic smoke test
        run: python scripts/smoke_synthetic.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q c_grid scripts tests
